services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: alfa
      POSTGRES_DB: alfa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa -d alfa"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://alfa:alfa@db:5432/alfa
      SECRET_KEY: ${SECRET_KEY:-change-me-demo}
      PIPELINE_STEP_DELAY: ${PIPELINE_STEP_DELAY:-1.2}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
